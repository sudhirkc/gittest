
name: Tracebit Security Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Tracebit canaries
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8
        with:
          api-token: ${{ secrets.TRACEBIT_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true

      
      - name: Simulate stolen credential use
        shell: bash
        run: |
          echo "Starting controlled canary detection test"

          AWS_ACCESS_KEY_ID="$__AWS__ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$__AWS__SECRET_ACCESS_KEY" \
          AWS_SESSION_TOKEN="$__AWS__SESSION_TOKEN" \
          AWS_DEFAULT_REGION="us-east-1" \
          aws sts get-caller-identity \
            --output json > /dev/null 2>&1 || true

          echo "AWS API test completed"

